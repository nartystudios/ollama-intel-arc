name: Build and Push ollama-sycl

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'ollama-sycl/**'
      - '.github/workflows/build-and-push.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ollama-sycl/**'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      ollama_version:
        description: 'Ollama version without leading v (e.g. 0.30.7). Leave empty for latest stable.'
        required: false
      ggml_commit:
        description: 'Optional llama.cpp tag or SHA (only workflow_dispatch). Empty = Dockerfile uses LLAMA_CPP_VERSION.'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest Ollama version
        id: ollama
        env:
          # inputs only exist on workflow_dispatch; avoid null on push/PR/schedule
          INPUT_OLLAMA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ollama_version || '' }}
          INPUT_GGML: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ggml_commit || '' }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_OLLAMA:-}" ]; then
            VERSION="${INPUT_OLLAMA}"
          else
            VERSION=$(curl -fsSL https://api.github.com/repos/ollama/ollama/releases/latest | jq -r .tag_name | sed 's/^v//')
          fi
          # Normalise: allow manual dispatch with leading "v"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "build_args<<BUILD_ARGS_EOF"
            echo "OLLAMA_VERSION=${VERSION}"
            if [ -n "${INPUT_GGML:-}" ]; then
              echo "GGML_COMMIT=${INPUT_GGML}"
            fi
            echo "BUILD_ARGS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Building Ollama v${VERSION}"

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build only (feature branch / PR)
        if: github.ref != 'refs/heads/main' && github.event_name != 'schedule'
        uses: docker/build-push-action@v5
        with:
          context: ./ollama-sycl
          push: false
          tags: |
            nartystudios/ollama-intel-arc-sycl:dev
          build-args: ${{ steps.ollama.outputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (main / nightly)
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
        uses: docker/build-push-action@v5
        with:
          context: ./ollama-sycl
          push: true
          tags: |
            nartystudios/ollama-intel-arc-sycl:latest
            nartystudios/ollama-intel-arc-sycl:${{ steps.ollama.outputs.version }}
            nartystudios/ollama-intel-arc-sycl:nightly
          build-args: ${{ steps.ollama.outputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
