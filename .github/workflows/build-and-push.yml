name: Build and Push ollama-sycl

on:
  push:
    branches: [main]
    paths:
      - 'ollama-sycl/**'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      ollama_version:
        description: 'Ollama version (leave empty for latest)'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest Ollama version
        id: ollama
        run: |
          VERSION="${{ github.event.inputs.ollama_version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -s https://api.github.com/repos/ollama/ollama/releases/latest | jq -r .tag_name | sed 's/v//')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Ollama v$VERSION"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./ollama-sycl
          push: true
          tags: |
            nartystudios/ollama-intel-arc-sycl:latest
            nartystudios/ollama-intel-arc-sycl:${{ steps.ollama.outputs.version }}
          build-args: |
            OLLAMA_VERSION=${{ steps.ollama.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
